<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glosario · Academia BCS</title>
  <meta name="description" content="Glosario del Battalion Combat Series v2.0 en inglés y castellano, con el número de regla de cada término.">
  <meta name="theme-color" content="#0d100e">
  <link rel="alternate" hreflang="es" href="https://bcs.nephei.org/glosario">
  <link rel="alternate" hreflang="en" href="https://bcs.nephei.org/en/glosario">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Condensed:wght@700&family=Saira+Stencil+One&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bcs.css">
</head>
<body>
<main>
  <section class="hero hero--pagina">
    <div class="wrap wrap--estrecho">
      <span class="antetitulo">Glosario</span>
      <h1>Los términos del reglamento</h1>
      <p class="lead">El BCS se juega con su vocabulario en inglés: aquí está cada término con su traducción y una explicación corta. El número es la regla de las <em>Series Rules</em> donde se define.</p>
    </div>
  </section>
  <div class="wrap wrap--estrecho">
    <label class="filtro">
      <svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filtro" type="search" placeholder="Filtrar: SNAFU, apoyo, retirada…" aria-label="Filtrar el glosario">
      <span class="muted mono" id="cuenta" style="font-size:.8rem"></span>
    </label>
    <div class="letras" id="letras"></div>
    <dl class="glosario" id="glosario"></dl>
  </div>
</main>

<script src="js/i18n.js"></script>
<script src="js/fichas.js"></script>
<script src="js/datos.js"></script>
<script src="js/comun.js"></script>
<script>
(function () {
  'use strict';
  const esc = Fichas.esc;
  const items = Datos.GLOSARIO.slice().sort((a, b) => a[0].localeCompare(b[0], 'en'));
  const dl = document.getElementById('glosario');
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const tr = I18N.t, CAP = Comun.CAPITULOS;
  const leccion = (h) => { const i = CAP.findIndex((c) => c[0] === h.split('#')[0]); return i < 0 ? '' : tr('Lección {n}', { n: i }) + ' · ' + CAP[i][1]; };
  const mas = (t) => {
    const h = Datos.DONDE[t], v = (Datos.VER[t] || []).filter((x) => items.some((i) => i[0] === x));
    if (!h && !v.length) return '';
    return `<div class="g-mas">${h ? `<a class="g-donde" href="${h}">${tr('Dónde se explica:')} ${esc(leccion(h))} →</a>` : ''}${v.length ? `<span class="g-ver">${tr('Ver también')}: ${v.map((x) => `<a href="#${Datos.slug(x)}">${esc(x)}</a>`).join(' · ')}</span>` : ''}</div>`;
  };
  dl.innerHTML = items.map(([t, es, d, r]) => `<div id="${Datos.slug(t)}" data-termino="${esc(t)}" data-txt="${esc(norm(t + ' ' + es + ' ' + d))}"><dt>${esc(t)}${es && es !== t ? `<span class="es">${esc(es)}</span>` : ''} <span class="regla">${esc(r)}</span></dt><dd>${esc(d)}</dd>${mas(t)}</div>`).join('');
  const letras = [...new Set(items.map((i) => i[0][0].toUpperCase()))];
  document.getElementById('letras').innerHTML = letras.map((l) => `<a href="#${Datos.slug(items.find((i) => i[0][0].toUpperCase() === l)[0])}">${l}</a>`).join('');
  const f = document.getElementById('filtro'), cuenta = document.getElementById('cuenta');
  const filtrar = () => {
    const q = norm(f.value.trim());
    let n = 0;
    dl.querySelectorAll(':scope > div').forEach((d) => { const v = !q || d.dataset.txt.includes(q); d.hidden = !v; if (v) n++; });
    cuenta.textContent = n + ' de ' + items.length;
  };
  Comun.enlazar(dl.querySelectorAll('dd'));
  f.addEventListener('input', filtrar);
  filtrar();
})();
</script>
</body>
</html>
